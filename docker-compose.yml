services:
  tts:
    build: .
    container_name: boa-tts
    restart: unless-stopped
    ports:
      - "11435:8000"
    networks:
      tts_net:
        ipv4_address: 192.168.250.10
    env_file:
      - .env
    environment:
      TTS_CUDA_DEVICE: ${TTS_CUDA_DEVICE:-0}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - hf_cache:/models/hf_cache
      - model_cache:/models/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s   # model loading takes time

# Pin the subnet: Docker's default pool hands out 172.x/16 ranges, which can
# swallow LAN clients in 172.x (e.g. 172.20.18.210) and break return routing.
networks:
  tts_net:
    ipam:
      config:
        - subnet: 192.168.250.0/24

volumes:
  hf_cache:
  model_cache:
